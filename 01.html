
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Paralaje | Primer movimiento </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body bgcolor="black">
      <p class="eyebrow">Paralaje</p>
      <h1>Testimonio de resistencia y permanencia: Primer movimiento</h1>
<p>
    <section class="player" aria-label="Reproductor de la obra">
      <p id="status" class="status" role="status">Activa el sonido para escuchar la semblanza.</p>

      <div class="controls">
        <button id="playButton" class="primary" type="button" aria-pressed="false">
          <span id="playIcon" aria-hidden="true">▶</span>
          <span id="playLabel">Escuchar</span>
        </button>
        <button id="restartButton" class="icon-button" type="button" title="Reiniciar" aria-label="Reiniciar audio">↺</button>
      </div>

      <label class="volume" for="musicVolume">
        <span>Música</span>
        <input id="musicVolume" type="range" min="0" max="1" value="0.22" step="0.01">
      </label>

      <audio id="narration" preload="metadata" src="primerMovimiento.mp3"></audio>
      <audio id="music" preload="metadata" src="musicaPrimerMovimiento.mp3" loop></audio>
    </section>
  </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
